<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a4d3e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maycie" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Maycie Tracker — daily progress for furniture &amp; fixture trading jobs" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <title>Maycie Tracker — Daily Progress</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">M</span>
        <div>
          <h1>Maycie Tracker</h1>
          <p class="tagline">Furniture &amp; Fixture Trading</p>
        </div>
      </div>
      <div class="topbar-meta">
        <span id="today-label"></span>
        <button type="button" class="btn btn-ghost" id="btn-menu" aria-label="Menu">☰</button>
      </div>
    </header>

    <nav class="tabs" id="main-tabs" role="tablist">
      <button type="button" class="tab active" data-view="dashboard">Dashboard</button>
      <button type="button" class="tab" data-view="jobs">Jobs</button>
      <button type="button" class="tab" data-view="materials">Materials</button>
      <button type="button" class="tab" data-view="staff">Staff</button>
      <button type="button" class="tab" data-view="reports">Reports</button>
    </nav>

    <main id="content"></main>

    <div id="drawer" class="drawer hidden" aria-hidden="true">
      <div class="drawer-backdrop" id="drawer-backdrop"></div>
      <aside class="drawer-panel">
        <h2>Menu &amp; Data</h2>
        <button type="button" class="btn btn-block" id="btn-export-json">Export JSON backup</button>
        <button type="button" class="btn btn-block" id="btn-import-json">Import JSON backup</button>
        <button type="button" class="btn btn-block" id="btn-export-csv">Export CSV</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
        <hr />
        <button type="button" class="btn btn-block btn-warn" id="btn-clear-sample">Clear sample data</button>
        <button type="button" class="btn btn-block btn-danger" id="btn-reset-all">Reset all data</button>
        <p class="hint">Data stays in this browser (localStorage). Use Export JSON to back up.</p>
        <button type="button" class="btn btn-ghost btn-block" id="btn-close-drawer">Close</button>
      </aside>
    </div>

    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-panel" id="modal-panel" role="dialog" aria-modal="true">
        <div class="modal-header">
          <h2 id="modal-title">Dialog</h2>
          <button type="button" class="btn btn-icon" id="modal-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
